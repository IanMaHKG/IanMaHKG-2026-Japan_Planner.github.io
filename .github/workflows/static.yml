# Deploys the Japan 2026 Trip Planner static site to GitHub Pages.
name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: ["main"]

  # Validate (no deploy) on pull requests
  pull_request:
    branches: ["main"]

  # Allow manual re-deploy from the Actions tab
  workflow_dispatch:

# Minimal token permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one active deployment at a time.
# Queued runs are skipped; the in-progress deploy is always allowed to finish
# so production is never left in a broken state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site (syntax, assets, data, service worker list)
        run: node scripts/validate.mjs

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1        # Shallow clone — only the latest snapshot is needed

      - name: Filter site files
        run: |
          # Copy only web-facing assets to _site/.
          # Excludes developer tooling (.github, .agents) and docs (*.md)
          # that have no business being publicly served on the CDN.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.agents/' \
            --exclude='data-src/' \
            --exclude='docs/' \
            --exclude='scripts/' \
            --exclude='package.json' \
            --exclude='*.md' \
            --exclude='_site/' \
            . _site/

      - name: Stamp service worker cache version
        run: |
          # Every deployment gets a unique cache name so returning users always
          # receive fresh assets (no manual CACHE_NAME bump needed).
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/sw.js
          grep -n "CACHE_NAME =" _site/sw.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10         # Prevent zombie runs blocking the concurrency group
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
